<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RVMC · Programa de la reunión</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RVMC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3D6370">
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" type="image/png" href="icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  --f:"Avenir","Avenir Next","Nunito Sans",-apple-system,"Segoe UI",sans-serif;
  --fondo:#F3F1EC; --tarjeta:#FFFFFF; --tinta:#1E2326; --suave:#6B7177; --linea:#E3DFD6;
  --pri:#3D6370; --pri2:#2E4E58; --ok:#4E7D4A; --peligro:#9B2C2C; --acento:#A67D2E;
  --radio:16px; --sombra:0 1px 2px rgba(30,35,38,.06),0 4px 14px rgba(30,35,38,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --fondo:#141617; --tarjeta:#1E2123; --tinta:#ECEAE5; --suave:#9AA0A5; --linea:#33383B; --sombra:none; }
  .pagina,.s89-mini{ box-shadow:0 0 0 1px #444 }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
h1{font-weight:800;font-size:26px;margin:4px 0 10px;letter-spacing:-.2px}
h2{font-weight:800;font-size:19px;margin:0}
h3{font-weight:800;font-size:16px;margin:0}
h2.sub{margin:22px 4px 10px;font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--suave)}
.app{display:flex;min-height:100vh}
nav.lateral{width:230px;flex:none;padding:calc(18px + env(safe-area-inset-top)) 12px 18px;position:sticky;top:0;height:100vh;border-right:1px solid var(--linea);background:var(--tarjeta);display:flex;flex-direction:column;gap:4px}
nav.lateral .marca{display:flex;align-items:center;gap:10px;padding:0 8px 16px;font-weight:800;font-size:19px}
nav.lateral .marca img{width:34px;height:34px;border-radius:9px}
nav button{font:inherit;border:0;background:none;color:var(--tinta);text-align:left;padding:10px 12px;border-radius:11px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600}
nav button:hover{background:var(--fondo)}
nav button.activo{background:var(--pri);color:#fff}
#estadoNube{margin-top:auto;font-size:12px;color:var(--suave);padding:8px}
main{flex:1;min-width:0;padding:calc(20px + env(safe-area-inset-top)) 26px 40px;max-width:1100px;margin:0 auto}
nav.abajo{display:none}
@media (max-width:820px){
  nav.lateral{display:none}
  main{padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom))}
  nav.abajo{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--tarjeta);border-top:1px solid var(--linea);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;justify-content:space-around}
  nav.abajo button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;flex:1}
  nav.abajo button span{font-size:20px}
  nav.abajo button.activo{background:none;color:var(--pri)}
  h1{font-size:22px}
}
.tarjeta{background:var(--tarjeta);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);margin-bottom:14px;border:1px solid var(--linea)}
.tarjeta.vacia{color:var(--suave);text-align:center;padding:30px}
.nota{color:var(--suave);font-size:13px}
.centro{text-align:center}
.gris{color:var(--suave)}
.btn{font:inherit;font-weight:600;border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta);padding:9px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.peligro{color:var(--peligro)}
.btn.peq{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.mini{padding:2px 8px;font-size:12px;border-radius:8px}
.btn.icono{width:42px;height:42px;justify-content:center;font-size:24px;padding:0}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fila-sep{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fila-sep.arriba{margin-bottom:12px}
.pastilla{background:var(--fondo);border:1px solid var(--linea);padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.pastilla.ok{background:#E3EFE0;border-color:#BBD5B5;color:#2F5A2B}
@media (prefers-color-scheme: dark){.pastilla.ok{background:#22351F;border-color:#365A31;color:#BCE3B5}}
.campo{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--linea);border-radius:10px;background:var(--fondo);color:var(--tinta)}
textarea.campo{resize:vertical}
.campo.corto{width:72px;flex:none}
.et{display:block;font-size:12px;font-weight:700;color:var(--suave);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px}
.rejilla .ancho{grid-column:1/-1}
.tres{display:flex;gap:6px}
.interruptor{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:6px 4px;cursor:pointer}
.interruptor input{width:18px;height:18px;accent-color:var(--pri)}
/* inicio */
.cab-inicio{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.cab-inicio .logo{width:62px;height:62px;border-radius:15px;box-shadow:var(--sombra)}
.cab-inicio h1{margin:0}
.cab-inicio p{margin:0;color:var(--suave)}
.cuadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cuadro{position:relative;background:var(--tarjeta);border:1px solid var(--linea);border-radius:20px;padding:18px 12px 14px;text-align:center;cursor:pointer;box-shadow:var(--sombra);transition:transform .12s}
.cuadro:hover{transform:translateY(-2px)}
.cuadro-tit{font-weight:700;margin-top:10px;font-size:14px}
.lapiz{position:absolute;top:6px;right:6px;border:0;background:var(--fondo);border-radius:99px;width:28px;height:28px;cursor:pointer;color:var(--suave);font-size:14px}
.ico{border-radius:22%;display:inline-flex;align-items:center;justify-content:center;object-fit:cover;flex:none;vertical-align:middle}
.ico.emo{background:var(--fondo)}
.previa-ico{text-align:center;margin-bottom:6px}
.prox{cursor:pointer;background:linear-gradient(135deg,var(--pri),#4F7E8C);color:#fff;border:0}
.prox .prox-eti{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.85;font-weight:700}
.prox .prox-fecha{font-size:20px;font-weight:800;margin:2px 0}
.prox .barra{background:rgba(255,255,255,.25)}
.prox .barra span{background:#fff}
.prox-nombres{margin-top:8px;font-size:14px}
.aviso-tarjeta{border:2px dashed var(--acento)}
/* mes */
.nav-mes{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.nav-mes h1,.nav-mes h2{margin:0;text-align:center;flex:1}
.semana-tarj{cursor:pointer}
.semana-tarj:hover{border-color:var(--pri)}
.sem-fecha{font-weight:800;font-size:16px}
.sem-fecha.grande{font-size:20px;margin-bottom:6px}
.kc{display:inline-flex;width:22px;height:22px;border-radius:6px;background:#8E9DB8;color:#fff;font-size:13px;align-items:center;justify-content:center;font-weight:800;vertical-align:2px}
ul.mini{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:1fr;gap:3px}
ul.mini li{display:flex;gap:8px;align-items:center;font-size:13.5px}
ul.mini .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--suave)}
ul.mini .n{font-weight:600;text-align:right}
ul.mini small{color:var(--suave);font-weight:400}
.num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;color:#fff;font-weight:800;font-size:13px}
.enlace{cursor:pointer;text-decoration:underline;text-decoration-color:var(--linea)}
.enlace-ext{display:inline-block;margin-top:8px;color:var(--pri);font-weight:600;font-size:14px}
/* semana */
.seccion{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);margin-bottom:14px;overflow:hidden;box-shadow:var(--sombra)}
.sec-cab{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--c);color:var(--c)}
@media (prefers-color-scheme: dark){.sec-cab{color:#fff}}
.sec-cab .ico{border-radius:10px}
.seccion>.btn{margin:10px 16px 14px}
.bloque-inicio{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 16px;margin-bottom:14px;box-shadow:var(--sombra)}
.cancion{font-weight:700;color:var(--suave);font-size:14px;padding:4px 0}
.seccion .cancion{padding:10px 16px 0}
.parte{padding:12px 16px;border-top:1px solid var(--linea);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:start}
.sec-cab+.parte,.cancion+.parte{border-top:0}
.parte-cab{display:flex;gap:10px;align-items:flex-start}
.parte-tit{min-width:0}
.min{color:var(--suave);font-size:12.5px}
.detalle{color:var(--suave);font-size:12.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11.5px;background:var(--fondo);border:1px solid var(--linea);padding:1px 8px;border-radius:99px;color:var(--suave);font-weight:600}
.controles{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.sel{display:flex;flex-direction:column;min-width:190px}
.sel.peq{min-width:110px}
.sel-et{font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.sel select{font:inherit;font-weight:600;padding:8px 10px;border-radius:10px;border:1px solid var(--linea);background:var(--fondo);color:var(--tinta);max-width:100%}
.sel.vacio select{border-color:#E2B45A;background:#FFF7E6;color:#7A5A16}
@media (prefers-color-scheme: dark){.sel.vacio select{background:#3A2F18;color:#F0D79E;border-color:#7A5A16}}
.sel.fijo b{padding:8px 0}
.bloque-inicio .controles{justify-content:flex-start;margin-top:6px}
@media (max-width:700px){.acciones .btn{flex:1 1 calc(50% - 8px);justify-content:center;white-space:normal;text-align:center}.acciones .interruptor{flex:1 1 100%}.parte{grid-template-columns:1fr}.controles{justify-content:stretch}.sel{flex:1 1 100%}.sel.peq{flex:1 1 100%}}
.parte.editando{display:block;background:rgba(166,125,46,.06)}
.ed-fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ed-fila .campo:not(.corto){flex:1;min-width:160px}
.ed-fila.der{justify-content:flex-end;margin:6px 0 0}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:13.5px;font-weight:600}
/* listas */
.listas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.listas .tarjeta{margin:0}
.lista-cab{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lista-cab h3{flex:1;font-size:14.5px}
.emo-lista{font-size:20px}
ol.nombres{list-style:none;margin:0;padding:0}
ol.nombres li{display:flex;align-items:center;gap:4px;padding:4px 0;border-bottom:1px dashed var(--linea)}
ol.nombres .nom{flex:1}
.nom small{color:var(--suave);font-size:11px;border:1px solid var(--linea);border-radius:5px;padding:0 4px;margin-left:4px}
.turno{color:transparent;width:14px}
.turno.sig{color:var(--acento)}
.anadir{display:flex;gap:6px;margin-top:10px}
.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:6px 14px;margin-top:8px}
.persona{display:flex;gap:6px;align-items:center}
.persona .nom{flex:1;min-width:0;font-weight:600;font-size:14px}
.persona .campo{width:140px;flex:none;padding:6px 9px}
/* estadísticas */
.segmentos{display:inline-flex;background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:3px;margin-bottom:12px}
.segmentos button{font:inherit;font-weight:600;border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--tinta)}
.segmentos button.activo{background:var(--pri);color:#fff}
.est{padding:8px 0;border-bottom:1px solid var(--linea)}
.est:last-child{border:0}
.est-cab{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.barra{height:8px;background:var(--fondo);border-radius:99px;overflow:hidden}
.barra span{display:block;height:100%;background:var(--pri);border-radius:99px}
.ejemplo{background:var(--fondo);border-left:4px solid #25D366;padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}
/* diálogos */
.capa{position:fixed;inset:0;background:rgba(20,22,23,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:ap .15s}
@keyframes ap{from{opacity:0}}
.dialogo{background:var(--tarjeta);border-radius:20px;width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-cab{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.dlg-cab .x{border:0;background:var(--fondo);width:32px;height:32px;border-radius:99px;cursor:pointer;color:var(--tinta);font-size:15px}
.dlg-cuerpo{padding:4px 18px 10px;overflow:auto}
.dlg-pie{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--linea);flex-wrap:wrap}
.pasos{margin:0 0 6px;padding-left:20px;color:var(--suave);font-size:14px}
.paginas{display:flex;flex-direction:column;gap:14px;align-items:center;background:var(--fondo);padding:14px;border-radius:12px}
.pagina{width:100%;max-width:620px;box-shadow:0 2px 12px rgba(0,0,0,.15);background:#fff}
.s89-fila{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea);align-items:flex-start}
.s89-mini{width:86px;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.2);flex:none}
.s89-info{flex:1;min-width:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1E2326;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}
@media (min-width:821px){#toast{bottom:28px}}
</style>
</head>
<body>
<div class="app">
  <nav class="lateral">
    <div class="marca"><img id="logoNav" alt="">RVMC</div>
    <button data-nav="inicio" onclick="ir('inicio')">🏠 Inicio</button>
    <button data-nav="semanas" onclick="ir('semanas')">📅 Programa</button>
    <button data-nav="listas" onclick="ir('listas')">👥 Listas</button>
    <button data-nav="estadisticas" onclick="ir('estadisticas')">📊 Estadísticas</button>
    <button data-nav="ajustes" onclick="ir('ajustes')">⚙️ Ajustes</button>
    <div id="estadoNube"></div>
  </nav>
  <main id="vista"></main>
</div>
<nav class="abajo">
  <button data-nav="inicio" onclick="ir('inicio')"><span>🏠</span>Inicio</button>

  <button data-nav="listas" onclick="ir('listas')"><span>👥</span>Listas</button>
  <button data-nav="estadisticas" onclick="ir('estadisticas')"><span>📊</span>Estadísticas</button>
  <button data-nav="ajustes" onclick="ir('ajustes')"><span>⚙️</span>Ajustes</button>
</nav>

const TIPOS = ['presidente', 'oracionInicial', 'oracionFinal', 'parte1', 'parte2', 'lectura',
  'maestros', 'vida', 'estudio', 'ancianos', 'lector', 'queDirias'];
const EDITABLES = TIPOS.filter(t => t !== 'queDirias' && t !== 'lector');

const TITULO_LISTA = {

};

function predeterminada(t) {
  if (typeof PUBLICO !== 'undefined' && PUBLICO) return [];
  const hermanos = [];
  switch (t) {
    case 'presidente': return hermanos.slice();
    case 'oracionInicial': return [];
    case 'oracionFinal': return [];
    case 'parte1': return [];
    case 'parte2': return [];
    case 'lectura': return [];
    case 'maestros': return [];
    case 'vida': return [];
    case 'estudio': return hermanos.slice();
    case 'lector': return [];
    case 'ancianos': return [];
    default: return [];
  }
}

const CARGOS = [
  { id: 'coordinador', titulo: 'Coordinador' },
  { id: 'superintendente', titulo: 'Superintendente de servicio' },
  { id: 'secretario', titulo: 'Secretario' }
];
const CARGOS_INICIALES = (typeof PUBLICO !== 'undefined' && PUBLICO) ? {} : {};

const TELEFONOS_INICIALES = (typeof PUBLICO !== 'undefined' && PUBLICO) ? {} : {};

const PLANTILLA_ORIGINAL = 'Hola {nombre}, te paso tu asignación para la reunión del {fecha}: parte {parte}, «{titulo}»{con ayudante}. Te envío el formulario S-89. ¡Gracias!';

// ---------- utilidades ----------

function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID().toUpperCase();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  }).toUpperCase();
}
const clon = o => JSON.parse(JSON.stringify(o));
function isoZ(d) { return new Date(d).toISOString().replace(/\.\d{3}Z$/, 'Z'); }
function fechaDe(s) { const d = new Date(s.fecha); return isNaN(d) ? new Date() : d; }
const DIA_MS = 86400000;

// ---------- datos vacíos y normalización ----------

function ajustesVacios() {
  return { diaSemana: 2, hora: 19, minuto: 0, prefijoPais: '34', plantillaMensaje: PLANTILLA_ORIGINAL };
}

function datosIniciales() {
  const d = { listas: {}, turnos: {}, ajustes: ajustesVacios(), semanas: [], telefonos: Object.assign({}, TELEFONOS_INICIALES),
    iconos: {}, titulos: {}, turnosMes: {}, cargos: Object.assign({}, CARGOS_INICIALES) };
  for (const t of EDITABLES) d.listas[t] = predeterminada(t);
  return d;
}

function normalizarParte(p) {
  return {
    id: p.id || uuid(), numero: +p.numero || 0, seccion: SECCIONES[p.seccion] ? p.seccion : 'vida',
    titulo: p.titulo || '', minutos: +p.minutos || 0, detalle: p.detalle || '', consejo: +p.consejo || 0,
    asignado: p.asignado || '', ayudante: p.ayudante || '', tieneAyudante: !!p.tieneAyudante,
    etiquetaAyudante: p.etiquetaAyudante || 'Ayudante', delPresidente: !!p.delPresidente, sala: +p.sala || 0
  };
}

function normalizarSemana(s) {
  const c = (s.canciones || []).slice(0, 3).map(n => +n || 0);
  while (c.length < 3) c.push(0);
  return {
    id: s.id || uuid(), url: s.url || '', titulo: s.titulo || '', lectura: s.lectura || '',
    fecha: s.fecha ? isoZ(s.fecha) : isoZ(new Date()), canciones: c,
    presidente: s.presidente || '', oracionInicial: s.oracionInicial || '', oracionFinal: s.oracionFinal || '',
    partes: (s.partes || []).map(normalizarParte)
  };
}

/** Rellena lo que falte (como hace Almacen.init y restaurar en Swift). */
function normalizarDatos(x) {
  const d = {
    listas: x.listas || {}, turnos: x.turnos || {}, ajustes: Object.assign(ajustesVacios(), x.ajustes || {}),
    semanas: (x.semanas || []).map(normalizarSemana), telefonos: x.telefonos || {}, iconos: x.iconos || {},
    titulos: x.titulos || {}, turnosMes: x.turnosMes || {}, cargos: x.cargos || {}
  };
  for (const t of EDITABLES) if (!d.listas[t]) d.listas[t] = predeterminada(t);
  if (!Object.keys(d.cargos).length && Object.keys(CARGOS_INICIALES).length) d.cargos = Object.assign({}, CARGOS_INICIALES);
  // El estudio bíblico ya no lleva lector.
  for (const s of d.semanas) for (const p of s.partes) {
    if (p.etiquetaAyudante === 'Lector') { p.tieneAyudante = false; p.ayudante = ''; }
  }
  return d;
}

// ---------- propiedades de una parte ----------

const esEstudio = p => p.seccion === 'vida' && p.etiquetaAyudante === 'Lector';

function encargo(p) {
  if (p.delPresidente || esEstudio(p)) return null;
  if (p.seccion === 'maestros' && p.tieneAyudante) return null;
  const t = (p.titulo + ' ' + p.detalle).toLowerCase();
  if (t.includes('superintendente de servicio')) return 'superintendente';
  if (t.includes('a cargo del coordinador')) return 'coordinador';
  if (t.includes('a cargo del secretario')) return 'secretario';
  if (t.includes('a cargo de un anciano') || t.includes('a cargo de uno de los ancianos')
    || t.includes('a cargo de los ancianos') || t.includes('un anciano')) return 'anciano';
  if (p.titulo.toLowerCase().includes('necesidades de la congregación')) return 'anciano';
  return null;
}

function listaDe(p) {
  if (encargo(p) !== null) return 'ancianos';
  switch (p.seccion) {
    case 'tesoros': return p.numero === 1 ? 'parte1' : (p.numero === 2 ? 'parte2' : 'lectura');
    case 'maestros': return /qu[ée] dir[íi]as/i.test(p.titulo) ? 'queDirias' : 'maestros';
    default: return p.etiquetaAyudante === 'Lector' ? 'estudio' : 'vida';
  }
}
const listaAyudanteDe = p => p.etiquetaAyudante === 'Lector' ? 'lector' : listaDe(p);

function minutosPrevistos(p) {
  if (p.seccion === 'tesoros') return p.numero === 1 ? 10 : (p.numero === 2 ? 10 : 4);
  if (esEstudio(p)) return 30;
  return null;
}
const minutosEfectivos = p => p.minutos > 0 ? p.minutos : (minutosPrevistos(p) || 0);

function contarSemana(s) {
  let total = 3, hechas = 0;
  if (s.presidente) hechas++;
  if (s.oracionInicial) hechas++;
  if (s.oracionFinal) hechas++;
  for (const p of s.partes) {
    if (p.delPresidente) continue;
    total++; if (p.asignado) hechas++;
    if (p.tieneAyudante) { total++; if (p.ayudante) hechas++; }
  }
  return { hechas, total };
}

// ---------- almacén con la lógica de turnos ----------

class Almacen {
  constructor(datos) { this.datos = datos; }

  nombres(tipo) {
    if (tipo === 'queDirias') {
      const vistos = new Set(), res = [];
      for (const n of this.nombres('presidente').concat(this.nombres('parte2'))) if (!vistos.has(n)) { vistos.add(n); res.push(n); }
      return res;
    }
    return this.datos.listas[tipo] || [];
  }

  todosLosNombres() {
    const v = new Set();
    for (const t of TIPOS) for (const n of this.nombres(t)) v.add(n);
    for (const n of Object.keys(this.datos.telefonos)) v.add(n);
    return [...v].sort((a, b) => a.localeCompare(b, 'es'));
  }

  get hermanos() {
    const r = new Set();
    for (const t of ['presidente', 'oracionInicial', 'oracionFinal', 'parte1', 'parte2', 'lectura', 'vida', 'estudio', 'ancianos'])
      for (const n of this.nombres(t)) r.add(n);
    return r;
  }
  varones() { return [...this.hermanos].sort((a, b) => a.localeCompare(b, 'es')); }

  semana(id) { return this.datos.semanas.find(s => s.id === id); }
  indice(id) { return this.datos.semanas.findIndex(s => s.id === id); }

  historial(tipo, excluir) {
    const h = new Map();
    const anota = (n, f, ay) => { if (n) { if (!h.has(n)) h.set(n, []); h.get(n).push({ t: f, ay }); } };
    for (const s of this.datos.semanas) {
      if (s.id === excluir) continue;
      const f = fechaDe(s).getTime();
      if (tipo === 'presidente') anota(s.presidente, f, false);
      else if (tipo === 'oracionInicial') anota(s.oracionInicial, f, false);
      else if (tipo === 'oracionFinal') anota(s.oracionFinal, f, false);
      else for (const p of s.partes) {
        if (p.delPresidente) continue;
        if (listaDe(p) === tipo) anota(p.asignado, f, false);
        if (p.tieneAyudante && listaAyudanteDe(p) === tipo) anota(p.ayudante, f, true);
      }
    }
    return h;
  }

  vecesJuntos(a, b, excluir) {
    let n = 0;
    for (const s of this.datos.semanas) {
      if (s.id === excluir) continue;
      for (const p of s.partes) if (p.tieneAyudante &&
        ((p.asignado === a && p.ayudante === b) || (p.asignado === b && p.ayudante === a))) n++;
    }
    return n;
  }

  /** Elige a quien más le toca (mismo orden de prioridades que la app de Swift). */
  siguiente(tipo, semana, pasadas, prohibidos, o = {}) {
    const permitido = o.permitido || (() => true);
    const rol = o.rol || 'ninguno', companero = o.companero || '', ocupados = o.ocupados || new Set();
    const lista = this.nombres(tipo);
    if (!lista.length) return null;
    const inicio = this.datos.turnos[tipo] || 0;
    const ventana = 182 * DIA_MS, reciente = 21 * DIA_MS, seguida = 8 * DIA_MS;
    const hist = this.historial(tipo, semana.id);
    const ft = fechaDe(semana).getTime();

    const puntos = new Map();
    lista.forEach((n, pos) => {
      if (puntos.has(n)) return;
      const veces = (hist.get(n) || []).filter(v => Math.abs(v.t - ft) <= ventana);
      const dist = veces.map(v => Math.abs(v.t - ft));
      const cerca = dist.length ? Math.min(...dist) : ventana * 10;
      const comoAy = veces.filter(v => v.ay).length, comoResp = veces.length - comoAy;
      const sesgo = rol === 'responsable' ? comoResp - comoAy : (rol === 'ayudante' ? comoAy - comoResp : 0);
      const juntos = companero ? this.vecesJuntos(n, companero, semana.id) : 0;
      const orden = ((pos - inicio) % lista.length + lista.length) % lista.length;
      puntos.set(n, [cerca < seguida ? 1 : 0, veces.length, cerca < reciente ? 1 : 0,
        ocupados.has(n) ? 1 : 0, Math.max(sesgo, 0), juntos, -cerca, orden]);
    });
    const mejorQue = (a, b) => {
      const pa = puntos.get(a), pb = puntos.get(b);
      for (let i = 0; i < pa.length; i++) if (pa[i] !== pb[i]) return pa[i] < pb[i];
      return false;
    };
    for (const evitar of pasadas) {
      const cand = lista.filter(n => !prohibidos.has(n) && !evitar.has(n) && permitido(n));
      if (cand.length) {
        let mejor = cand[0];
        for (const c of cand.slice(1)) if (mejorQue(c, mejor)) mejor = c;
        this.datos.turnos[tipo] = (lista.indexOf(mejor) + 1) % lista.length;
        return mejor;
      }
    }
    return null;
  }

  /** Partes a cargo de «un anciano»: siguen el orden de la lista de ancianos. */
  siguienteNecesidades(s, k, evitar) {
    const lista = this.nombres('ancianos');
    if (!lista.length) return null;
    let ultimo = null;
    for (let i = k - 1; i >= 0; i--) {
      const p = s.partes[i];
      if (encargo(p) === 'anciano' && lista.includes(p.asignado)) { ultimo = p.asignado; break; }
    }
    if (ultimo === null) {
      const ft = fechaDe(s).getTime();
      const previas = this.datos.semanas.filter(w => w.id !== s.id && fechaDe(w).getTime() < ft)
        .sort((a, b) => fechaDe(b) - fechaDe(a));
      buscar: for (const w of previas) {
        for (let i = w.partes.length - 1; i >= 0; i--) {
          const p = w.partes[i];
          if (encargo(p) === 'anciano' && lista.includes(p.asignado)) { ultimo = p.asignado; break buscar; }
        }
      }
    }
    let inicio;
    if (ultimo !== null && lista.includes(ultimo)) inicio = (lista.indexOf(ultimo) + 1) % lista.length;
    else inicio = (this.datos.turnos.ancianos || 0) % lista.length;
    for (let d = 0; d < lista.length; d++) {
      const pos = (inicio + d) % lista.length;
      if (!evitar.has(lista[pos])) { this.datos.turnos.ancianos = (pos + 1) % lista.length; return lista[pos]; }
    }
    this.datos.turnos.ancianos = (inicio + 1) % lista.length;
    return lista[inicio];
  }

  asignarPorTurnos(id, sobrescribir) {
    const i = this.indice(id);
    if (i < 0) return;
    const s = clon(this.datos.semanas[i]);
    this.datos.semanas[i] = s; // el historial ve la semana por su id, así que da igual
    const hnos = this.hermanos;

    if (sobrescribir) {
      s.presidente = s.oracionInicial = s.oracionFinal = '';
      for (const p of s.partes) { p.asignado = ''; p.ayudante = ''; }
    }

    const estrictos = new Set(), todos = new Set();
    const marca = (n, flexible) => { if (!n) return; todos.add(n); if (!flexible) estrictos.add(n); };
    marca(s.presidente, false); marca(s.oracionInicial, true); marca(s.oracionFinal, true);
    for (const p of s.partes) { const f = listaDe(p) === 'parte2'; marca(p.asignado, f); marca(p.ayudante, f); }

    const mismoGrupo = otro => {
      if (!otro) return () => true;
      const esH = hnos.has(otro);
      return n => hnos.has(n) === esH;
    };

    // 0) Partes que la guía pone a cargo de un anciano o de una responsabilidad concreta.
    for (const p of s.partes) {
      if (p.asignado) continue;
      const e = encargo(p);
      if (e && e !== 'anciano') {
        const n = this.datos.cargos[e];
        if (n) { p.asignado = n; marca(n, false); }
      }
    }
    s.partes.forEach((p, k) => {
      if (!p.asignado && encargo(p) !== null) {
        const n = this.siguienteNecesidades(s, k, estrictos);
        if (n) { p.asignado = n; marca(n, false); }
      }
    });

    // 1) Presidente
    if (!s.presidente) {
      const n = this.siguiente('presidente', s, [todos, estrictos, new Set()], new Set());
      if (n) { s.presidente = n; marca(n, false); }
    }

    // 2) Partes que es mejor no repetir (todas menos el número 2)
    for (const p of s.partes) {
      if (p.delPresidente || listaDe(p) === 'parte2') continue;
      const lista = listaDe(p);
      const esMaestros = p.seccion === 'maestros' && lista === 'maestros';
      const conPareja = esMaestros && p.tieneAyudante;
      if (!p.asignado) {
        const permitido = (esMaestros && !p.tieneAyudante) ? (n => hnos.has(n))
          : (conPareja ? mismoGrupo(p.ayudante) : (() => true));
        const n = this.siguiente(lista, s, [todos, estrictos, new Set()], new Set([p.ayudante]),
          { permitido, rol: conPareja ? 'responsable' : 'ninguno', companero: p.ayudante });
        if (n) { p.asignado = n; marca(n, false); }
      }
      if (p.tieneAyudante && !p.ayudante) {
        const resp = p.asignado;
        const n = this.siguiente(listaAyudanteDe(p), s, [todos, estrictos, new Set()], new Set([resp]),
          { permitido: conPareja ? mismoGrupo(resp) : (() => true), rol: conPareja ? 'ayudante' : 'ninguno', companero: resp });
        if (n) { p.ayudante = n; marca(n, false); }
      }
    }

    // 3) Número 2: se igualan turnos aunque ya tenga otra parte; no junto a la parte vecina.
    s.partes.forEach((p, k) => {
      if (p.delPresidente || listaDe(p) !== 'parte2') return;
      const vecinos = new Set();
      if (k > 0) vecinos.add(s.partes[k - 1].asignado);
      if (k + 1 < s.partes.length) vecinos.add(s.partes[k + 1].asignado);
      vecinos.delete('');
      if (!p.asignado) {
        const n = this.siguiente('parte2', s, [vecinos, new Set()], new Set(), { ocupados: todos });
        if (n) { p.asignado = n; marca(n, true); }
      }
    });

    // 4) Oraciones
    if (!s.oracionInicial) {
      const n = this.siguiente('oracionInicial', s, [new Set()], new Set([s.oracionFinal]), { ocupados: todos });
      if (n) { s.oracionInicial = n; marca(n, true); }
    }
    if (!s.oracionFinal) {
      const n = this.siguiente('oracionFinal', s, [new Set()], new Set([s.oracionInicial]), { ocupados: todos });
      if (n) { s.oracionFinal = n; marca(n, true); }
    }
    this.datos.semanas[i] = s;
  }

  dejarEnBlanco(id) {
    const s = this.semana(id);
    if (!s) return;
    s.presidente = s.oracionInicial = s.oracionFinal = '';
    for (const p of s.partes) { p.asignado = ''; p.ayudante = ''; }
  }

  reiniciarTurnos() { this.datos.turnos = {}; }
  guardarTurnosInicioMes(clave, semanas) {
    if (!this.datos.turnosMes[clave] && semanas.every(s => contarSemana(s).hechas === 0))
      this.datos.turnosMes[clave] = clon(this.datos.turnos);
  }
  fijarTurnosInicioMes(clave) { this.datos.turnosMes[clave] = clon(this.datos.turnos); }
  restaurarTurnosInicioMes(clave) { if (this.datos.turnosMes[clave]) this.datos.turnos = clon(this.datos.turnosMes[clave]); }

  semanasDelMes(anio, mes) {
    return this.datos.semanas.filter(s => { const f = fechaDe(s); return f.getFullYear() === anio && f.getMonth() === mes; })
      .sort((a, b) => fechaDe(a) - fechaDe(b));
  }

  mensajeS89(item) {
    const pila = item.persona.split(' ')[0] || item.persona;
    const conAy = item.ayudante ? `, con ${item.ayudante} de ayudante` : '';
    let t = this.datos.ajustes.plantillaMensaje || PLANTILLA_ORIGINAL;
    const cambios = [['{nombre completo}', item.persona], ['{nombre}', pila], ['{fecha}', Fmt.larga(item.fecha).toLowerCase()],
      ['{parte}', String(item.numero)], ['{titulo}', item.tituloParte], ['{con ayudante}', conAy], ['{ayudante}', item.ayudante]];
    for (const [m, v] of cambios) t = t.split(m).join(v);
    return t;
  }

  s89Items(semanas) {
    const r = [];
    for (const s of semanas) for (const p of s.partes) {
      if (p.seccion !== 'maestros' || p.delPresidente || !p.asignado) continue;
      r.push({ semana: s, parte: p, persona: p.asignado, telefono: this.datos.telefonos[p.asignado] || '',
        numero: p.numero, tituloParte: p.titulo, ayudante: p.tieneAyudante ? p.ayudante : '', fecha: fechaDe(s) });
    }
    return r;
  }

  enlaceWhatsApp(item) {
    let num = (item.telefono || '').replace(/\D/g, '');
    const pref = (this.datos.ajustes.prefijoPais || '').replace(/\D/g, '');
    if (num && pref && num.length <= 9) num = pref + num;
    return 'https://wa.me/' + num + '?text=' + encodeURIComponent(this.mensajeS89(item));
  }

  estadisticas(semanas) {
    const d = new Map();
    for (const n of this.todosLosNombres()) d.set(n, { nombre: n, presidencias: 0, partes: 0 });
    const fila = n => { if (!d.has(n)) d.set(n, { nombre: n, presidencias: 0, partes: 0 }); return d.get(n); };
    for (const s of semanas) {
      if (s.presidente) fila(s.presidente).presidencias++;
      for (const p of s.partes) if (!p.delPresidente && p.asignado) fila(p.asignado).partes++;
    }
    return [...d.values()].map(f => Object.assign(f, { total: f.presidencias + f.partes }))
      .sort((a, b) => b.total - a.total || a.nombre.localeCompare(b.nombre, 'es'));
  }
}

// ---------- formatos de fecha (es-ES) ----------

const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dos = n => String(n).padStart(2, '0');
const Fmt = {
  larga: d => cap(`${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`),
  corta: d => `${dos(d.getDate())}/${dos(d.getMonth() + 1)}/${d.getFullYear()}`,
  diaMes: d => cap(`${DIAS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`),
  mesAnio: (a, m) => cap(`${MESES[m]} ${a}`),
  iso: d => `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())}`,
  hora: d => `${dos(d.getHours())}:${dos(d.getMinutes())}`,
  claveMes: (a, m) => `${a}-${dos(m + 1)}`
};
const semanaDelMes = s => Math.floor((fechaDe(s).getDate() - 1) / 7) + 1;

// ---------- filas del programa (con horas) ----------

function construirFilas(s) {
  const f0 = fechaDe(s);
  let t = f0.getHours() * 60 + f0.getMinutes();
  const h = m => `${dos(Math.floor(m / 60) % 24)}:${dos(m % 60)}`;
  const num = n => n ? String(n) : '';
  const f = [];
  f.push({ hora: h(t), cancion: true, texto: num(s.canciones[0]), nombre: s.oracionInicial, secundario: '(Oración)' });
  t += 5;
  f.push({ hora: h(t), texto: 'Introducción', nombre: s.presidente, secundario: '(Presidente)' });
  t += 1;
  let actual = null;
  for (const p of s.partes) {
    if (p.seccion !== actual) {
      actual = p.seccion;
      let tit = SECCIONES[p.seccion].titulo;
      if (p.seccion === 'tesoros' && s.lectura) tit += ` (${s.lectura})`;
      f.push({ cabecera: p.seccion, texto: tit });
      if (p.seccion === 'vida') { f.push({ hora: h(t), cancion: true, texto: num(s.canciones[1]) }); t += 5; }
    }
    const me = minutosEfectivos(p);
    f.push({ hora: h(t), numero: p.numero, texto: p.titulo, duracion: me > 0 ? `(${me} min.)` : '',
      nombre: p.delPresidente ? s.presidente : p.asignado,
      secundario: (p.tieneAyudante && !p.delPresidente) ? p.ayudante : '' });
    t += me + (p.seccion === 'maestros' ? p.consejo : 0);
  }
  f.push({ hora: h(t), texto: 'Conclusión', nombre: s.presidente });
  t += 3;
  f.push({ hora: h(t), cancion: true, texto: num(s.canciones[2]), nombre: s.oracionFinal, secundario: '(Oración)' });
  return f;
}

// ---------- importación de la guía (texto pegado de jw.org) ----------

const MESES_NUM = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12 };

/** «26 de abril a 2 de mayo de 2027» o «22 a 28 de febrero de 2027» → fecha del lunes. */
function fechaDeTexto(txt) {
  const t = (txt || '').replace(/[-_/]+/g, ' ').replace(/\s+/g, ' ');
  const L = '[a-záéíóúñ]+';
  let m = t.match(new RegExp(`(\\d{1,2}) de (${L}) al? (\\d{1,2}) de (${L}) de (\\d{4})`, 'i'));
  if (m) {
    const m1 = MESES_NUM[m[2].toLowerCase()] || 0, m2 = MESES_NUM[m[4].toLowerCase()] || 0, an = +m[5];
    if (m1) return { inicio: new Date(m1 > m2 ? an - 1 : an, m1 - 1, +m[1], 12), texto: m[0] };
  }
  m = t.match(new RegExp(`(\\d{1,2}) al? (\\d{1,2}) de (${L}) de (\\d{4})`, 'i'));
  if (m) {
    const mm = MESES_NUM[m[3].toLowerCase()] || 0;
    if (mm) return { inicio: new Date(+m[4], mm - 1, +m[1], 12), texto: m[0] };
  }
  return null;
}

function lecturaSemanal(l) {
  if (l !== l.toUpperCase()) return null;
  const m = l.match(/^((?:[1-3]\s)?[A-ZÁÉÍÓÚÜÑ]{3,}(?:\s[A-ZÁÉÍÓÚÜÑ]{2,})*)\s+(\d[\d,;:\-–\s]*)$/);
  if (!m) return null;
  const peq = new Set(['DE', 'DEL', 'LA', 'LOS', 'LAS']);
  const libro = m[1].split(' ').map(p => peq.has(p) ? p.toLowerCase() : p.charAt(0) + p.slice(1).toLowerCase()).join(' ');
  return libro + ' ' + m[2].trim().replace(/,\s*/g, ', ');
}

const limpiaBajo = l => l.toLowerCase().replace(/\s+/g, ' ').trim();
const esCabecera = b => b === 'tesoros de la biblia' || b === 'seamos mejores maestros' || b === 'nuestra vida cristiana';

function construirParte(numero, seccion, cuerpo) {
  let titulo = cuerpo[0], minutos = 0;
  const resto = [];
  cuerpo.forEach((linea, k) => {
    let texto = linea;
    if (!minutos) {
      const g = texto.match(/\((\d+)\s*mins?\.?\)/i);
      if (g) { minutos = +g[1]; texto = texto.replace(g[0], '').trim(); }
    }
    if (k === 0) titulo = texto; else if (texto) resto.push(texto);
  });
  let detalle = resto.join(' ');
  if (detalle.length > 300) detalle = detalle.slice(0, 300) + '…';
  const t = titulo.toLowerCase(), d = detalle.toLowerCase();
  const delPresidente = d.includes('a cargo del presidente');
  let ayudante = false, etiqueta = 'Ayudante', consejo = 0;
  if (seccion === 'maestros' && !delPresidente) {
    const disc = /qu[ée] dir[íi]as/.test(t);
    ayudante = !(disc || t.startsWith('discurso') || d.startsWith('discurso'));
    consejo = disc ? 0 : 1;
  }
  if (seccion === 'vida' && t.includes('estudio bíblico')) etiqueta = 'Lector';
  const p = normalizarParte({ numero, seccion, titulo, minutos, detalle, consejo, tieneAyudante: ayudante,
    etiquetaAyudante: etiqueta, delPresidente });
  if (!p.minutos) { const fijo = minutosPrevistos(p); if (fijo) p.minutos = fijo; }
  return p;
}

/** Analiza el texto copiado de la página de la semana. */
function analizarTexto(texto) {
  const lineas = (texto || '').replace(/ /g, ' ').split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  let seccion = null, lectura = '', esperado = 1, terminado = false;
  const canciones = [], partes = [];
  const esFin = (l, sig) => {
    const b = limpiaBajo(l);
    if (esCabecera(b) || b.startsWith('palabras de conclusión')) return true;
    if (/^canci[oó]n\s+\d+/i.test(l)) return true;
    const g = l.match(/^(\d{1,2})\.\s*(.+)$/);
    return !!(g && +g[1] === sig);
  };
  let i = 0;
  while (i < lineas.length) {
    const l = lineas[i], b = limpiaBajo(l);
    for (const m of l.matchAll(/canci[oó]n\s+(\d+)/gi)) if (canciones.length < 3) canciones.push(+m[1]);
    if (terminado) { if (canciones.length >= 3) break; i++; continue; }
    if (!seccion && !lectura && !canciones.length) { const lt = lecturaSemanal(l); if (lt) lectura = lt; }
    if (b === 'tesoros de la biblia') { seccion = 'tesoros'; i++; continue; }
    if (b === 'seamos mejores maestros') { seccion = 'maestros'; i++; continue; }
    if (b === 'nuestra vida cristiana') { seccion = 'vida'; i++; continue; }
    if (b.startsWith('palabras de conclusión')) { terminado = true; i++; continue; }
    const g = l.match(/^(\d{1,2})\.\s*(.+)$/);
    if (seccion && g && +g[1] === esperado) {
      const cuerpo = [g[2]];
      let j = i + 1;
      while (j < lineas.length && !esFin(lineas[j], esperado + 1)) { cuerpo.push(lineas[j]); j++; }
      partes.push(construirParte(esperado, seccion, cuerpo));
      esperado++; i = j; continue;
    }
    i++;
  }
  while (canciones.length < 3) canciones.push(0);
  const fd = fechaDeTexto(lineas.slice(0, 40).join(' '));
  return { lectura, canciones, partes, inicio: fd ? fd.inicio : null, titulo: fd ? fd.texto : '' };
}

/** Partes habituales para crear una semana a mano. */
function partesModelo() {
  const P = (numero, seccion, titulo, minutos, extra = {}) => normalizarParte(Object.assign({ numero, seccion, titulo, minutos }, extra));
  return [
    P(1, 'tesoros', 'Discurso', 10), P(2, 'tesoros', 'Busquemos perlas escondidas', 10), P(3, 'tesoros', 'Lectura de la Biblia', 4),
    P(4, 'maestros', 'Empiece conversaciones', 3, { tieneAyudante: true, consejo: 1 }),
    P(5, 'maestros', 'Haga revisitas', 4, { tieneAyudante: true, consejo: 1 }),
    P(6, 'maestros', 'Haga discípulos', 5, { tieneAyudante: true, consejo: 1 }),
    P(7, 'vida', 'Parte de Nuestra vida cristiana', 15),
    P(8, 'vida', 'Estudio bíblico de la congregación', 30, { etiquetaAyudante: 'Lector' })
  ];
}

/** Fecha de la reunión a partir del lunes de la semana y los ajustes. */
function fechaReunion(lunes, aj) {
  const d = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + (+aj.diaSemana || 0), +aj.hora || 0, +aj.minuto || 0);
  return d;
}

function lunesDe(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  const dia = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - dia);
  return x;
}

const FUENTE = '"Avenir", "Avenir Next", "Nunito Sans", "Helvetica Neue", Arial, sans-serif';
const EMOJI = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
const FUENTE_NEGRITA = '"Avenir-Heavy", "Avenir", "Avenir Next", "Nunito Sans", sans-serif';
const keycap = n => String(n) + '️⃣';

const cargaImg = {};
function imagen(src) {
  if (!src) return Promise.resolve(null);
  if (!cargaImg[src]) cargaImg[src] = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  return cargaImg[src];
}

async function fuentesListas() {
  try { await Promise.all([document.fonts.load('13px "Nunito Sans"'), document.fonts.load('700 13px "Nunito Sans"')]); } catch (e) {}
}

/** Corta un texto en líneas que caben en «ancho» (máx. «max» líneas, con «…»). */
function partirTexto(ctx, texto, ancho, max) {
  const palabras = String(texto).split(/\s+/);
  const lineas = [];
  let actual = '';
  for (const p of palabras) {
    const prueba = actual ? actual + ' ' + p : p;
    if (ctx.measureText(prueba).width <= ancho || !actual) actual = prueba;
    else { lineas.push(actual); actual = p; }
  }
  if (actual) lineas.push(actual);
  if (lineas.length > max) {
    const r = lineas.slice(0, max);
    let u = r[max - 1];
    while (u.length > 1 && ctx.measureText(u + '…').width > ancho) u = u.slice(0, -1);
    r[max - 1] = u + '…';
    return r;
  }
  return lineas;
}

function textoAjustado(ctx, texto, x, y, ancho, tam, alinear, minEscala = 0.65) {
  let t = tam;
  ctx.font = `${t}px ${FUENTE}`;
  while (t > tam * minEscala && ctx.measureText(texto).width > ancho) { t -= 0.25; ctx.font = `${t}px ${FUENTE}`; }
  ctx.textAlign = alinear;
  ctx.fillText(texto, alinear === 'right' ? x + ancho : x, y, ancho);
  ctx.textAlign = 'left';
}

/** Dibuja el programa de una semana en una página A4 (595 × 842 pt). */
async function dibujarPrograma(s, iconos, escala = 3) {
  const c = document.createElement('canvas');
  c.width = 595 * escala; c.height = 842 * escala;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.scale(escala, escala);
  ctx.translate((595 - 583 * 0.88) / 2, 40);
  ctx.scale(0.88, 0.88);
  ctx.textBaseline = 'alphabetic';

  // Barra de fecha
  const f = fechaDe(s);
  ctx.fillStyle = '#FFEBCC'; ctx.fillRect(0, 0, 368, 31);
  ctx.fillStyle = '#E0E8FF'; ctx.fillRect(368, 0, 583 - 368, 31);
  ctx.fillStyle = '#000';
  ctx.font = `17px ${EMOJI}`;
  ctx.fillText('📆', 8, 22);
  ctx.fillText(keycap(semanaDelMes(s)), 31, 22);
  ctx.font = `13.5px ${FUENTE}`;
  ctx.fillText(Fmt.larga(f), 58, 20.5, 368 - 64);
  ctx.fillText('Reunión de entre semana', 376, 20.5);

  let y = 31 + 16;
  const filas = construirFilas(s);
  for (const fila of filas) {
    if (fila.cabecera) {
      const sec = SECCIONES[fila.cabecera];
      y += 8;
      const img = await imagen(iconos[fila.cabecera]);
      if (img) ctx.drawImage(img, 0, y, 50, 50);
      else { ctx.font = `34px ${EMOJI}`; ctx.fillText(SECCIONES[fila.cabecera].emoji, 6, y + 40); }
      ctx.fillStyle = sec.color;
      ctx.font = `14.5px ${FUENTE}`;
      ctx.fillText(fila.texto, 87, y + 50 - 6, 583 - 90);
      ctx.fillRect(0, y + 50, 583, 2.5);
      ctx.fillStyle = '#000';
      y += 52.5 + 2;
      continue;
    }
    const xCont = 87, wCont = 583 - 87 - 120 - 91;
    // contenido (título con duración) — hasta 2 líneas
    ctx.font = `13px ${FUENTE}`;
    let lineas = [];
    let xTexto = xCont;
    if (fila.cancion) {
      lineas = [fila.texto];
    } else {
      if (fila.numero != null) xTexto = xCont + 22;
      lineas = partirTexto(ctx, fila.texto, wCont - (xTexto - xCont) - (fila.duracion ? 4 : 0), 2);
    }
    const alto = 13 + 9 + (lineas.length - 1) * 16;
    const base = y + 4.5 + 12;
    // hora
    ctx.fillStyle = '#000';
    ctx.font = `11px ${FUENTE}`; ctx.textAlign = 'right'; ctx.fillText(fila.hora, 80, base); ctx.textAlign = 'left';
    if (fila.cancion) {
      ctx.font = `14px ${EMOJI}`; ctx.fillText('🎵', xCont, base);
      ctx.font = `13px ${FUENTE}`; ctx.fillText(fila.texto, xCont + 22, base);
    } else {
      if (fila.numero != null) {
        if (fila.numero < 10) { ctx.font = `15px ${EMOJI}`; ctx.fillText(keycap(fila.numero), xCont, base + 1); }
        else {
          ctx.fillStyle = '#6B80AD';
          ctx.beginPath(); ctx.roundRect ? ctx.roundRect(xCont, base - 12.5, 16, 16, 3) : ctx.rect(xCont, base - 12.5, 16, 16); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = `bold 9px ${FUENTE}`; ctx.textAlign = 'center';
          ctx.fillText(String(fila.numero), xCont + 8, base - 1.5); ctx.textAlign = 'left'; ctx.fillStyle = '#000';
        }
      }
      ctx.font = `13px ${FUENTE}`;
      lineas.forEach((l, k) => ctx.fillText(l, xTexto, base + k * 16));
      if (fila.duracion) {
        const ult = lineas[lineas.length - 1] || '';
        const w = ctx.measureText(ult).width;
        ctx.font = `10px ${FUENTE}`; ctx.fillStyle = '#8a8a8a';
        const xd = xTexto + w + 6;
        if (xd + ctx.measureText(fila.duracion).width <= xCont + wCont + 10) ctx.fillText(fila.duracion, xd, base + (lineas.length - 1) * 16);
        ctx.fillStyle = '#000';
      }
    }
    // nombre y secundario
    ctx.fillStyle = '#000';
    if (fila.nombre) textoAjustado(ctx, fila.nombre, 583 - 91 - 120, base, 120, 13, 'right', 0.7);
    if (fila.secundario) { ctx.fillStyle = '#8a8a8a'; textoAjustado(ctx, fila.secundario, 583 - 82, base, 82, 10.5, 'left', 0.65); ctx.fillStyle = '#000'; }
    y += alto;
  }
  return c;
}

/** Dibuja un S-89 relleno sobre la imagen del formulario. */
async function dibujarS89(item, fondo) {
  const img = await imagen(fondo);
  const W = 240.9, H = 320.3;
  const k = img ? img.width / W : 3.47;
  const c = document.createElement('canvas');
  c.width = Math.round(W * k); c.height = Math.round(H * k);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  if (img) ctx.drawImage(img, 0, 0, c.width, c.height);
  ctx.scale(k, k);
  const escribe = (t, x, yy, w) => {
    if (!t) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, H - yy - 17, w, 17); ctx.clip();
    ctx.fillStyle = '#000';
    ctx.font = `9.5px Helvetica, Arial, ${FUENTE}`;
    ctx.fillText(t, x + 2, H - (yy + 5));
    ctx.restore();
  };
  escribe(item.persona, 64, 264, 165);
  escribe(item.ayudante, 73, 241, 156);
  escribe(Fmt.corta(item.fecha), 53, 218, 176);
  escribe(String(item.numero), 123, 195, 106);
  const cas = [141, 127, 113][Math.min(Math.max(item.parte.sala || 0, 0), 2)];
  const r = { x: 24, y: H - cas - 10, w: 11, h: 10 };
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(r.x + 2, r.y + 2); ctx.lineTo(r.x + r.w - 2, r.y + r.h - 2);
  ctx.moveTo(r.x + 2, r.y + r.h - 2); ctx.lineTo(r.x + r.w - 2, r.y + 2);
  ctx.stroke();
  return { canvas: c, w: W, h: H };
}

function canvasAJpeg(c, calidad = 0.9) {
  return new Promise(res => c.toBlob(b => b.arrayBuffer().then(a => res(new Uint8Array(a))), 'image/jpeg', calidad));
}

/** PDF mínimo: una imagen JPEG a página completa por página. */
function pdfDeImagenes(paginas) {
  const enc = new TextEncoder();
  const trozos = [];
  let largo = 0;
  const offsets = [];
  const pon = x => { const b = typeof x === 'string' ? enc.encode(x) : x; trozos.push(b); largo += b.length; };
  const n = paginas.length;
  // 1 catálogo, 2 páginas, luego por página: página, contenido, imagen
  const idPag = i => 3 + i * 3;
  pon('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj = (id, cuerpo) => { offsets[id] = largo; pon(`${id} 0 obj\n`); cuerpo(); pon('\nendobj\n'); };
  obj(1, () => pon('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => pon(`<< /Type /Pages /Count ${n} /Kids [${paginas.map((_, i) => `${idPag(i)} 0 R`).join(' ')}] >>`));
  paginas.forEach((p, i) => {
    const ip = idPag(i), ic = ip + 1, ii = ip + 2;
    const w = p.w.toFixed(2), h = p.h.toFixed(2);
    obj(ip, () => pon(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 ${ii} 0 R >> >> /Contents ${ic} 0 R >>`));
    const cont = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    obj(ic, () => pon(`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`));
    obj(ii, () => {
      pon(`<< /Type /XObject /Subtype /Image /Width ${p.iw} /Height ${p.ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);
      pon(p.jpg); pon('\nendstream');
    });
  });
  const total = 3 + n * 3;
  const xref = largo;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  pon(x);
  pon(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out = new Uint8Array(largo);
  let o = 0;
  for (const t of trozos) { out.set(t, o); o += t.length; }
  return new Blob([out], { type: 'application/pdf' });
}

async function pdfPrograma(semanas, iconos) {
  await fuentesListas();
  const pags = [], vistas = [];
  for (const s of semanas) {
    const c = await dibujarPrograma(s, iconos);
    pags.push({ w: 595, h: 842, iw: c.width, ih: c.height, jpg: await canvasAJpeg(c, 0.9) });
    vistas.push(c);
  }
  return { blob: pdfDeImagenes(pags), vistas };
}

async function pdfS89(items, fondo) {
  const pags = [], vistas = [];
  for (const it of items) {
    const r = await dibujarS89(it, fondo);
    pags.push({ w: r.w, h: r.h, iw: r.canvas.width, ih: r.canvas.height, jpg: await canvasAJpeg(r.canvas, 0.92) });
    vistas.push(r.canvas);
  }
  return { blob: pdfDeImagenes(pags), vistas };
}

// ====================================================================
//  RVMC · interfaz, guardado y sincronización
// ====================================================================

let D = null;                // datos (mismo formato que la app de Swift)
let A = null;                // almacén con la lógica
let IMAGENES = {};           // clave → PNG en base64 (sin prefijo)
let MODIFICADO = null;       // fecha ISO de la última modificación
const UI = { mes: null, editarPartes: false, s89: null, verMesCompleto: false, estTodo: false, estMes: null };
let DL = null;               // capacidad de descargas
const CLAVE_LOCAL = 'rvmc-web-v1';

const $ = (sel, raiz = document) => raiz.querySelector(sel);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------------- guardado local ----------------

function leerLocal() {
  try { const t = localStorage.getItem(CLAVE_LOCAL); return t ? JSON.parse(t) : null; } catch (e) { return null; }
}
function escribirLocal(pendiente) {
  try { localStorage.setItem(CLAVE_LOCAL, JSON.stringify({ datos: D, imagenes: IMAGENES, modificado: MODIFICADO, pendiente })); } catch (e) {}
}

function ponerDatos(datos, imagenes, modificado) {
  D = normalizarDatos(datos);
  A = new Almacen(D);
  IMAGENES = imagenes || {};
  MODIFICADO = modificado || null;
}

/** Llamar después de cada cambio. */
function guardar(sinRender) {
  MODIFICADO = isoZ(new Date());
  escribirLocal(true);
  Nube.programar();
  if (!sinRender) render();
}

// ---------------- sincronización (base de datos del artefacto) ----------------

const Nube = {
  estado: 'local', ref: null, colSem: null, colImg: null, ultimo: {}, timer: null, subiendo: false, otraVez: false, sucio: false,

  async iniciar() {
    if (!window.claude || !window.claude.use) { this.poner('local'); return; }
    let db = null, user = null;
    try { [db, user, DL] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]); } catch (e) {}
    render();
    if (!db || !user) { this.poner('local'); return; }
    let uid = null;
    try { uid = await user.id(); } catch (e) {}
    if (!uid) { this.poner('local'); return; }
    this.ref = db.doc(`data/users/${uid}/rvmc`);
    this.colSem = this.ref.collection('semanas');
    this.colImg = this.ref.collection('imagenes');
    this.poner('cargando');
    try {
      const [cfg, sem, img] = await Promise.all([this.ref.get(), this.colSem.get(), this.colImg.get()]);
      const local = leerLocal();
      const remotoMod = cfg.exists ? (cfg.data().modificado || '') : '';
      if (!cfg.exists || (local && local.pendiente && (local.modificado || '') > remotoMod)) {
        this.sucio = true;
        await this.subir();
      } else {
        this.aplicar(cfg, sem.docs, img.docs, true);
      }
      this.escuchar();
      this.poner('nube');
    } catch (e) {
      console.warn('nube', e);
      this.poner('error');
    }
  },

  poner(e) { this.estado = e; const b = $('#estadoNube'); if (b) b.innerHTML = this.etiqueta(); },
  etiqueta() {
    return ({ local: '💻 Guardado en este dispositivo', cargando: '⏳ Sincronizando…', nube: '☁️ Sincronizado en tu cuenta',
      error: '⚠️ Sin conexión: se guarda en este navegador', subiendo: '⏳ Guardando…' })[this.estado] || '';
  },

  docs() {
    const cfg = { listas: D.listas, turnos: D.turnos, ajustes: D.ajustes, telefonos: D.telefonos, iconos: D.iconos,
      titulos: D.titulos, turnosMes: D.turnosMes, cargos: D.cargos };
    const r = { cfg: JSON.stringify(cfg) };
    for (const s of D.semanas) r['s:' + s.id] = JSON.stringify(s);
    for (const k of Object.keys(IMAGENES)) r['i:' + k] = IMAGENES[k];
    return r;
  },

  aplicar(cfg, semDocs, imgDocs, inicial) {
    const nuevo = {};
    let datos = clon(D || datosIniciales());
    if (cfg && cfg.exists) {
      try { Object.assign(datos, JSON.parse(cfg.data().json)); nuevo.cfg = cfg.data().json; } catch (e) {}
      MODIFICADO = cfg.data().modificado || MODIFICADO;
    }
    if (semDocs) {
      datos.semanas = [];
      for (const d of semDocs) { try { const j = d.data().json; datos.semanas.push(JSON.parse(j)); nuevo['s:' + d.id] = j; } catch (e) {} }
    }
    let imgs = IMAGENES;
    if (imgDocs) {
      imgs = {};
      for (const d of imgDocs) { const v = d.data().b64; if (v) { imgs[d.data().clave || d.id] = v; nuevo['i:' + (d.data().clave || d.id)] = v; } }
    }
    ponerDatos(datos, imgs, MODIFICADO);
    if (semDocs) {
      // Las claves que ya coinciden con la base no se vuelven a subir.
      for (const k of Object.keys(this.ultimo)) if (k.startsWith('s:') && !(k in nuevo)) delete this.ultimo[k];
    }
    Object.assign(this.ultimo, nuevo);
    escribirLocal(false);
    if (!inicial) renderSiNoEscribe();
    else render();
  },

  escuchar() {
    const listo = () => !this.sucio && !this.subiendo;
    this.ref.onSnapshot(s => { if (s.metadata.hasPendingWrites || !listo() || !s.exists) return;
      if (s.data().json !== this.ultimo.cfg) this.aplicar(s, null, null, false); }, e => console.warn(e));
    this.colSem.onSnapshot(q => { if (q.metadata.hasPendingWrites || q.metadata.fromCache || !listo()) return;
      const cambia = q.docs.length !== D.semanas.length || q.docs.some(d => d.data().json !== this.ultimo['s:' + d.id]);
      if (cambia) this.aplicar(null, q.docs, null, false); }, e => console.warn(e));
    this.colImg.onSnapshot(q => { if (q.metadata.hasPendingWrites || q.metadata.fromCache || !listo()) return;
      const cambia = q.docs.length !== Object.keys(IMAGENES).length || q.docs.some(d => d.data().b64 !== IMAGENES[d.data().clave || d.id]);
      if (cambia) this.aplicar(null, null, q.docs, false); }, e => console.warn(e));
  },

  programar() {
    if (!this.ref) return;
    this.sucio = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.subir(), 900);
  },

  async subir() {
    if (!this.ref) return;
    if (this.subiendo) { this.otraVez = true; return; }
    this.subiendo = true; this.poner('subiendo');
    try {
      do {
        this.otraVez = false; this.sucio = false;
        const ahora = this.docs();
        let hubo = false;
        for (const [k, v] of Object.entries(ahora)) {
          if (this.ultimo[k] === v) continue;
          hubo = true;
          if (k === 'cfg') await this.ref.set({ json: v, modificado: MODIFICADO || isoZ(new Date()) });
          else if (k.startsWith('s:')) await this.colSem.doc(k.slice(2)).set({ json: v });
          else await this.colImg.doc(claveDoc(k.slice(2))).set({ clave: k.slice(2), b64: v });
          this.ultimo[k] = v;
        }
        for (const k of Object.keys(this.ultimo)) {
          if (k in ahora) continue;
          if (k.startsWith('s:')) await this.colSem.doc(k.slice(2)).delete();
          else if (k.startsWith('i:')) await this.colImg.doc(claveDoc(k.slice(2))).delete();
          delete this.ultimo[k];
          hubo = true;
        }
        if (hubo && this.ultimo.cfg === ahora.cfg && MODIFICADO) await this.ref.update({ modificado: MODIFICADO });
      } while (this.otraVez || this.sucio);
      escribirLocal(false);
      this.poner('nube');
    } catch (e) {
      console.warn('subir', e);
      this.sucio = true;
      this.poner('error');
      if (e && e.code === 'quota_exceeded') aviso('No queda espacio en la base de datos. Borra semanas antiguas (después de guardar una copia).');
    }
    this.subiendo = false;
  }
};
const claveDoc = k => k.replace(/[^A-Za-z0-9_\-.~:@+]/g, '_');

function renderSiNoEscribe() {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'checkbox') {
    a.addEventListener('blur', () => render(), { once: true });
  } else render();
}

// ---------------- avisos, diálogos y descargas ----------------

function aviso(texto) {
  const t = $('#toast');
  t.textContent = texto; t.classList.add('ver');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => t.classList.remove('ver'), 3800);
}

function dialogo({ titulo, cuerpo = '', botones = [], ancho }) {
  const capa = document.createElement('div');
  capa.className = 'capa';
  capa.innerHTML = `<div class="dialogo" ${ancho ? `style="max-width:${ancho}px"` : ''} role="dialog" aria-modal="true">
    <div class="dlg-cab"><h3>${h(titulo)}</h3><button class="x" data-cerrar aria-label="Cerrar">✕</button></div>
    <div class="dlg-cuerpo">${cuerpo}</div>
    <div class="dlg-pie">${botones.map((b, i) => `<button class="btn ${b.clase || ''}" data-b="${i}">${h(b.texto)}</button>`).join('')}</div></div>`;
  const cerrar = () => capa.remove();
  capa.addEventListener('click', e => {
    if (e.target === capa || e.target.closest('[data-cerrar]')) return cerrar();
    const b = e.target.closest('[data-b]');
    if (b) { const def = botones[+b.dataset.b]; const r = def.accion ? def.accion(capa) : null; if (r !== false) cerrar(); }
  });
  document.body.appendChild(capa);
  const primero = capa.querySelector('input,textarea,select');
  if (primero) setTimeout(() => primero.focus(), 50);
  return capa;
}

function confirmar(titulo, texto, opciones) {
  dialogo({ titulo, cuerpo: `<p>${h(texto)}</p>`, botones: [{ texto: 'Cancelar' }].concat(opciones) });
}

async function descargar(nombre, datos) {
  if (DL) {
    try { await DL.save({ filename: nombre, data: datos }); return true; }
    catch (e) {
      if (e && e.code === 'declined') return false;
      if (e && e.code === 'rate_limited') { aviso('Espera un momento y vuelve a intentarlo.'); return false; }
    }
  }
  const blob = datos instanceof Blob ? datos : new Blob([datos]);
  // En iPhone e iPad: menú Compartir (AirPrint, WhatsApp, Guardar en Archivos…).
  const movil = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (movil && navigator.canShare) {
    try {
      const tipo = nombre.endsWith('.pdf') ? 'application/pdf' : 'application/json';
      const f = new File([blob], nombre, { type: tipo });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: nombre }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { aviso('No se pudo guardar el archivo.'); }
  return true;
}

async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); aviso('Copiado'); }
  catch (e) { dialogo({ titulo: 'Copia el texto', cuerpo: `<textarea class="campo" rows="6" readonly>${h(texto)}</textarea>`, botones: [{ texto: 'Cerrar', clase: 'pri' }] }); }
}

  });
  return capa;
}

function leerImagen(file, lado) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const i = new Image();
      i.onload = () => {
        const k = Math.min(1, lado / Math.max(i.width, i.height));
        const c = document.createElement('canvas');
        c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
        c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
        res(c.toDataURL('image/png').split(',')[1]);
      };
      i.onerror = rej; i.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function mesInicial() {
  const ayer = Date.now() - DIA_MS;
  const fechas = D.semanas.map(fechaDe);
  const prox = fechas.filter(f => f.getTime() >= ayer).sort((a, b) => a - b)[0];
  const ult = fechas.sort((a, b) => b - a)[0];
  const f = prox || ult || new Date();
  return { a: f.getFullYear(), m: f.getMonth() };
}
function moverMes(o, d) { const x = new Date(o.a, o.m + d, 1); return { a: x.getFullYear(), m: x.getMonth() }; }

function render() {
  if (!D) return;
  if (!UI.mes) UI.mes = mesInicial();

function opciones(lista, actual, s, extra = {}) {
  const ocupados = new Map();
  const anota = (n, q) => { if (n) ocupados.set(n, (ocupados.get(n) || []).concat(q)); };
  anota(s.presidente, 'presidente'); anota(s.oracionInicial, 'oración'); anota(s.oracionFinal, 'oración');
  for (const p of s.partes) { anota(p.asignado, 'n.º ' + p.numero); if (p.tieneAyudante) anota(p.ayudante, 'ayud. ' + p.numero); }
  const filtro = extra.filtro || (() => true);
  const principal = A.nombres(lista).filter(filtro);
  const resto = A.todosLosNombres().filter(n => !principal.includes(n) && filtro(n));
  const op = n => {
    const o = (ocupados.get(n) || []).filter(x => !(n === actual && extra.yo && x === extra.yo));
    return `<option value="${h(n)}" ${n === actual ? 'selected' : ''}>${h(n)}${o.length ? ' · ' + h(o.join(', ')) : ''}</option>`;
  };
  let html = `<option value="">— Sin asignar —</option>`;
  if (actual && !principal.includes(actual) && !resto.includes(actual)) html += op(actual);
  html += principal.map(op).join('');
  if (resto.length) html += `<optgroup label="Otras personas">${resto.map(op).join('')}</optgroup>`;
  return html;
}

function selector(campo, lista, actual, s, extra = {}, etiqueta = '') {
  return `<label class="sel ${actual ? '' : 'vacio'}">${etiqueta ? `<span class="sel-et">${h(etiqueta)}</span>` : ''}
    <select data-campo="${campo}" data-sem="${s.id}" ${extra.pid ? `data-pid="${extra.pid}"` : ''}>${opciones(lista, actual, s, extra)}</select></label>`;
}

function etiquetaEncargo(p) {
  const e = encargo(p);
  if (!e) return '';
  if (e === 'anciano') return '<span class="chip">👴 Anciano</span>';
  const c = CARGOS.find(x => x.id === e);
  return `<span class="chip">👴 ${h(c ? c.titulo : e)}</span>`;
}

function filaParte(s, p, compacto) {
  const sec = SECCIONES[p.seccion];
  const lista = listaDe(p);
  const hn = A.hermanos;
  let controles;
  if (p.delPresidente) {
    controles = `<div class="sel fijo"><span class="sel-et">A cargo del presidente</span><b>${h(s.presidente || '—')}</b></div>`;
  } else {
    const esMaes = p.seccion === 'maestros' && lista === 'maestros';
    const conPareja = esMaes && p.tieneAyudante;
    let fResp = () => true, fAy = () => true;
    if (esMaes && !p.tieneAyudante) fResp = n => hn.has(n);
    if (conPareja && p.ayudante) { const g = hn.has(p.ayudante); fResp = n => hn.has(n) === g; }
    if (conPareja && p.asignado) { const g = hn.has(p.asignado); fAy = n => hn.has(n) === g && n !== p.asignado; }
    controles = selector('asignado', lista, p.asignado, s, { pid: p.id, filtro: fResp, yo: 'n.º ' + p.numero }, p.tieneAyudante ? 'Responsable' : '')
      + (p.tieneAyudante ? selector('ayudante', listaAyudanteDe(p), p.ayudante, s, { pid: p.id, filtro: fAy, yo: 'ayud. ' + p.numero }, 'Ayudante') : '');
    if (p.seccion === 'maestros') controles += `<label class="sel peq"><span class="sel-et">Sala</span><select data-campo="sala" data-sem="${s.id}" data-pid="${p.id}">

  }
  const chips = [etiquetaEncargo(p), lista === 'queDirias' ? '<span class="chip">💬 ¿Qué dirías?</span>' : '',
    esEstudio(p) ? '<span class="chip">📘 Estudio · tiempo fijo</span>' : '',

function dialogoImportar(semExistente) {
  const sug = semExistente ? lunesDe(fechaDe(semExistente)) : siguienteLunes();
  const capa = dialogo({
    titulo: semExistente ? 'Volver a importar las partes' : 'Nueva semana',
    ancho: 640,
    cuerpo: `<ol class="pasos"><li>Abre la página de la semana en jw.org (Guía de actividades).</li>
      <li>Selecciona todo el texto (⌘A / Ctrl+A), cópialo y pégalo abajo.</li></ol>
      <label class="et">Dirección de la página (para la fecha y el enlace)</label>
      <input class="campo" id="impUrl" value="${h(semExistente ? semExistente.url : '')}" placeholder="https://www.jw.org/es/biblioteca/guia-actividades-reunion-testigos-jehova/…">
      <label class="et">Texto de la página</label>
      <textarea class="campo" id="impTxt" rows="9" placeholder="Pega aquí el texto copiado de la guía…"></textarea>
      <label class="et">Lunes de esa semana</label>
      <input class="campo" type="date" id="impLunes" value="${Fmt.iso(sug)}">
      <p class="nota" id="impInfo">La reunión se pone el ${DIAS[(1 + (+D.ajustes.diaSemana)) % 7]} a las ${dos(D.ajustes.hora)}:${dos(D.ajustes.minuto)} (cámbialo en Ajustes).</p>`,
    botones: [
      ...(semExistente ? [] : [{ texto: 'Crear vacía (partes típicas)', accion: c => crearSemana(c, true) }]),
      { texto: 'Cancelar' },
      { texto: semExistente ? 'Reemplazar partes' : 'Importar', clase: 'pri', accion: c => semExistente ? reimportar(c, semExistente) : crearSemana(c, false) }
    ]
  });
  const act = () => {
    const fd = fechaDeTexto(decodeURIComponent($('#impUrl', capa).value)) || fechaDeTexto($('#impTxt', capa).value.slice(0, 3000));
    if (fd) $('#impLunes', capa).value = Fmt.iso(lunesDe(fd.inicio));
    const t = $('#impTxt', capa).value;
    if (t.trim()) {
      const r = analizarTexto(t);
      $('#impInfo', capa).innerHTML = r.partes.length
        ? `✅ ${r.partes.length} partes encontradas${r.lectura ? ' · ' + h(r.lectura) : ''} · canciones ${r.canciones.filter(Boolean).join(', ') || '—'}`
        : '⚠️ Aún no encuentro partes numeradas. Asegúrate de copiar toda la página.';
    }
  };
  $('#impUrl', capa).addEventListener('input', act);
  $('#impTxt', capa).addEventListener('input', act);
}

function siguienteLunes() {
  const fechas = D.semanas.map(fechaDe).sort((a, b) => b - a);
  if (fechas.length) { const l = lunesDe(fechas[0]); l.setDate(l.getDate() + 7); return l; }
  return lunesDe(new Date());
}

function leerFechaInput(v) { const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d, 12); }

function crearSemana(capa, vacia) {
  const url = $('#impUrl', capa).value.trim();
  const lunesV = $('#impLunes', capa).value;
  if (!lunesV) { aviso('Pon la fecha del lunes de esa semana.'); return false; }
  let partes = partesModelo(), lectura = '', canciones = [0, 0, 0];
  if (!vacia) {
    const r = analizarTexto($('#impTxt', capa).value);
    if (!r.partes.length) { aviso('No he encontrado partes numeradas en el texto. ¿Has copiado toda la página de la semana?'); return false; }
    partes = r.partes; lectura = r.lectura; canciones = r.canciones;
  }
  const fecha = fechaReunion(leerFechaInput(lunesV), D.ajustes);
  const ya = D.semanas.find(s => Fmt.iso(fechaDe(s)) === Fmt.iso(fecha));
  if (ya) { aviso('Ya existe una semana con esa fecha.'); return false; }
  const s = normalizarSemana({ url, lectura, canciones, partes, fecha: isoZ(fecha), titulo: '' });
  D.semanas.push(s);
  UI.mes = { a: fecha.getFullYear(), m: fecha.getMonth() };
  guardar(true);
  ir('semana-' + s.id);
  aviso(vacia ? 'Semana creada. Activa «Editar partes» para ajustarlas.' : 'Semana importada.');
}

function reimportar(capa, s) {
  const r = analizarTexto($('#impTxt', capa).value);
  if (!r.partes.length) { aviso('No he encontrado partes numeradas en el texto.'); return false; }
  // Conserva lo asignado cuando coincide número y sección.
  for (const p of r.partes) {
    const v = s.partes.find(x => x.numero === p.numero && x.seccion === p.seccion);
    if (v) { p.asignado = v.asignado; p.ayudante = p.tieneAyudante ? v.ayudante : ''; p.sala = v.sala; }
  }
  s.partes = r.partes;
  if (r.lectura) s.lectura = r.lectura;
  if (r.canciones.some(Boolean)) s.canciones = r.canciones;
  const url = $('#impUrl', capa).value.trim(); if (url) s.url = url;
  const lunesV = $('#impLunes', capa).value;
  if (lunesV) s.fecha = isoZ(fechaReunion(leerFechaInput(lunesV), D.ajustes));
  guardar();
  aviso('Partes actualizadas.');
}

      if (!nuevo || nuevo === viejo) return;
      for (const t of Object.keys(D.listas)) D.listas[t] = D.listas[t].map(n => n === viejo ? nuevo : n);
      if (D.telefonos[viejo] != null) { D.telefonos[nuevo] = D.telefonos[viejo]; delete D.telefonos[viejo]; }

      for (const s of D.semanas) {
        for (const f of ['presidente', 'oracionInicial', 'oracionFinal']) if (s[f] === viejo) s[f] = nuevo;
        for (const p of s.partes) { if (p.asignado === viejo) p.asignado = nuevo; if (p.ayudante === viejo) p.ayudante = nuevo; }
      }
      guardar();
    } }] });
}

function exportarCopia() {
  const copia = { version: 1, fecha: isoZ(new Date()), datos: D, imagenes: IMAGENES };
  const blob = new Blob([JSON.stringify(copia)], { type: 'application/json' });
  descargar(`Copia RVMC ${Fmt.iso(new Date())}.json`, blob);
}

function importarCopia() {
  let inp = $('#archivoCopia');
  if (!inp) { inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,.appbackup,application/json'; inp.hidden = true; document.body.appendChild(inp); }
  inp.value = '';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    f.text().then(t => {
      let c;
      try { c = JSON.parse(t); } catch (e) { aviso('Ese archivo no es una copia de RVMC.'); return; }
      const datos = c.datos || (c.listas || c.semanas ? c : null);
      if (!datos) { aviso('Ese archivo no es una copia de RVMC.'); return; }
      const fecha = c.fecha ? Fmt.larga(new Date(c.fecha)).toLowerCase() : 'fecha desconocida';
      confirmar('Restaurar copia', `Copia del ${fecha} con ${(datos.semanas || []).length} semanas. Lo que hay ahora aquí se sustituirá.`, [{
        texto: 'Reemplazar mis datos', clase: 'peligro', accion: () => {
          ponerDatos(datos, c.imagenes || {}, null);
          UI.mes = null; UI.estMes = null;
          guardar(true); ir('semanas');
          aviso('Copia restaurada.');
        } }]);
    });
  };
  inp.click();
}
