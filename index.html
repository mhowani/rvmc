document.addEventListener('click', e => {
  const b = e.target.closest('[data-acc]');
  if (!b) return;
  const acc = b.dataset.acc, id = b.dataset.id;
  if (b.tagName === 'INPUT' && b.type === 'checkbox') return; // se maneja en «change»
  switch (acc) {
    case 'cuadro': { if (e.target.closest('.lapiz')) return; const k = b.dataset.k;
      if (k === 'copias') { ir('ajustes'); setTimeout(() => { const c = $('#copias'); c && c.scrollIntoView(); }, 50); } else ir(CUADROS[k].ruta); break; }
    case 'editarCuadro': e.stopPropagation(); editarCuadro(b.dataset.k); break;
    case 'ir': ir(b.dataset.r); break;
    case 'abrir': if (e.target.closest('select,input,button:not([data-acc=abrir])')) return; ir('semana-' + id); break;
    case 'mes': UI.mes = moverMes(UI.mes, +b.dataset.d); render(); break;
    case 'volverMes': { const f = fechaDe(A.semana(id)); UI.mes = { a: f.getFullYear(), m: f.getMonth() }; ir('semanas'); break; }
    case 'nuevaSemana': dialogoImportar(null); break;
    case 'reimportar': dialogoImportar(A.semana(id)); break;
    case 'asignarSem': A.asignarPorTurnos(id, false); guardar(); aviso('Asignado lo que faltaba.'); break;
    case 'rehacerSem': confirmar('Rehacer semana', 'Se borran todas las asignaciones de esta semana y se reparten de nuevo por turnos.', [{ texto: 'Rehacer', clase: 'peligro', accion: () => { A.asignarPorTurnos(id, true); guardar(); } }]); break;
    case 'blancoSem': confirmar('Dejar en blanco', 'Se quitan presidente, oraciones, responsables y ayudantes de esta semana.', [{ texto: 'Dejar en blanco', clase: 'peligro', accion: () => { A.dejarEnBlanco(id); guardar(); } }]); break;
    case 'borrarSem': confirmar('Borrar semana', 'La semana y sus asignaciones se borran para siempre.', [{ texto: 'Borrar', clase: 'peligro', accion: () => {
      const s = A.semana(id); const f = fechaDe(s); D.semanas = D.semanas.filter(x => x.id !== id); A.datos = D;
      UI.mes = { a: f.getFullYear(), m: f.getMonth() }; guardar(true); ir('semanas'); } }]); break;
    case 'pdfSem': { const s = A.semana(id); verPrograma([s], `Programa ${Fmt.iso(fechaDe(s))}`); break; }
    case 's89Sem': { const s = A.semana(id); panelS89([s], Fmt.diaMes(fechaDe(s))); break; }
    case 'asignarMes': { const sem = semanasMes(); A.guardarTurnosInicioMes(claveMesUI(), sem); for (const s of sem) A.asignarPorTurnos(s.id, false); guardar(); aviso('Mes asignado (solo lo que faltaba).'); break; }
    case 'rehacerMes': confirmar('Rehacer el mes', `Se borran las asignaciones de las ${semanasMes().length} semanas de ${Fmt.mesAnio(UI.mes.a, UI.mes.m)} y se reparten de nuevo.`, [
      { texto: 'Empezando por el primero', clase: 'peligro', accion: () => rehacerMes(true) },
      { texto: 'Continuando los turnos', clase: 'pri', accion: () => rehacerMes(false) }]); break;
    case 'blancoMes': confirmar('Dejar el mes en blanco', `Se quitan todas las asignaciones de las ${semanasMes().length} semanas de ${Fmt.mesAnio(UI.mes.a, UI.mes.m)}.`, [
      { texto: 'Y reiniciar turnos', clase: 'peligro', accion: () => blancoMes(true) },
      { texto: 'Dejar en blanco', clase: 'peligro', accion: () => blancoMes(false) }]); break;
    case 'pdfMes': verPrograma(semanasMes(), `Programa ${Fmt.mesAnio(UI.mes.a, UI.mes.m)}`); break;
    case 's89Mes': panelS89(semanasMes(), Fmt.mesAnio(UI.mes.a, UI.mes.m)); break;
    case 's89Uno': s89Uno(+b.dataset.i); break;
    case 's89Copiar': copiar(A.mensajeS89(UI.s89.items[+b.dataset.i])); break;
    case 'parteMover': { const s = A.semana(b.dataset.sem), k = +b.dataset.k, d = +b.dataset.d, j = k + d;
      if (j < 0 || j >= s.partes.length) return; [s.partes[k], s.partes[j]] = [s.partes[j], s.partes[k]]; renumerar(s); guardar(); break; }
    case 'parteBorrar': { const s = A.semana(b.dataset.sem); s.partes.splice(+b.dataset.k, 1); renumerar(s); guardar(); break; }
    case 'parteNueva': { const s = A.semana(b.dataset.sem), sec = b.dataset.secc;
      const p = normalizarParte({ seccion: sec, titulo: 'Nueva parte', minutos: sec === 'maestros' ? 4 : 10, tieneAyudante: sec === 'maestros', consejo: sec === 'maestros' ? 1 : 0 });
      let pos = s.partes.length; for (let i = s.partes.length - 1; i >= 0; i--) { if (ORDEN_SECCIONES.indexOf(s.partes[i].seccion) <= ORDEN_SECCIONES.indexOf(sec)) { pos = i + 1; break; } if (i === 0) pos = 0; }
      s.partes.splice(pos, 0, p); renumerar(s); guardar(); break; }
    case 'lMover': { const l = D.listas[b.dataset.t], i = +b.dataset.i, j = i + +b.dataset.d; if (j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; guardar(); break; }
    case 'lQuitar': D.listas[b.dataset.t].splice(+b.dataset.i, 1); guardar(); break;
    case 'lAnadir': anadirNombre(b.dataset.t); break;
    case 'renombrar': renombrar(b.dataset.n); break;
    case 'estTodo': UI.estTodo = b.dataset.v === '1'; render(); break;
    case 'estMes': UI.estMes = moverMes(UI.estMes, +b.dataset.d); render(); break;
    case 'plantillaOriginal': D.ajustes.plantillaMensaje = PLANTILLA_ORIGINAL; guardar(); break;
    case 'exportarCopia': exportarCopia(); break;
    case 'importarCopia': importarCopia(); break;
    case 'reiniciarTurnos': confirmar('Reiniciar turnos', 'La próxima asignación empezará por el primero de cada lista.', [{ texto: 'Reiniciar', clase: 'peligro', accion: () => { A.reiniciarTurnos(); guardar(); aviso('Turnos reiniciados.'); } }]); break;
  }
});

function rehacerMes(reiniciar) {
  const sem = semanasMes();
  for (const s of sem) A.dejarEnBlanco(s.id);
  if (reiniciar) { A.reiniciarTurnos(); A.fijarTurnosInicioMes(claveMesUI()); } else A.restaurarTurnosInicioMes(claveMesUI());
  for (const s of sem) A.asignarPorTurnos(s.id, true);
  guardar(); aviso('Mes rehecho.');
}
function blancoMes(reiniciar) {
  for (const s of semanasMes()) A.dejarEnBlanco(s.id);
  if (reiniciar) { A.reiniciarTurnos(); A.fijarTurnosInicioMes(claveMesUI()); } else A.restaurarTurnosInicioMes(claveMesUI());
  guardar();
}
function renumerar(s) { s.partes.forEach((p, i) => p.numero = i + 1); }
function anadirNombre(t) {
  const inp = document.querySelector(`[data-anadir="${t}"]`);
  const n = (inp.value || '').trim();
  if (!n) return;
  if (D.listas[t].includes(n)) { aviso('Ya está en la lista.'); return; }
  D.listas[t].push(n); guardar();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.anadir) { e.preventDefault(); anadirNombre(e.target.dataset.anadir); }
  if (e.key === 'Escape') { const c = document.querySelector('.capa:last-of-type'); if (c) c.remove(); }
});

document.addEventListener('change', e => {
  const el = e.target, ds = el.dataset;
  if (ds.acc === 'verCompleto') { UI.verMesCompleto = el.checked; render(); return; }
  if (ds.acc === 'editarPartes') { UI.editarPartes = el.checked; render(); return; }
  if (ds.campo) {
    const s = A.semana(ds.sem); if (!s) return;
    if (ds.pid) {
      const p = s.partes.find(x => x.id === ds.pid);
      if (ds.campo === 'sala') p.sala = +el.value; else p[ds.campo] = el.value;
      // Si cambia el responsable y el ayudante ya no es del mismo grupo, se quita.
      if (ds.campo === 'asignado' && p.tieneAyudante && p.ayudante && p.seccion === 'maestros' && listaDe(p) === 'maestros') {
        const hn = A.hermanos; if (p.asignado && hn.has(p.asignado) !== hn.has(p.ayudante)) { p.ayudante = ''; aviso('Se ha quitado el ayudante: debe ser del mismo sexo.'); }
        if (p.asignado === p.ayudante) p.ayudante = '';
      }
    } else s[ds.campo] = el.value;
    guardar(); return;
  }
  if (ds.ed) {
    const s = A.semana(ds.sem), p = s.partes.find(x => x.id === ds.pid);
    if (ds.ed === 'titulo' || ds.ed === 'detalle') p[ds.ed] = el.value;
    else if (ds.ed === 'minutos' || ds.ed === 'consejo') p[ds.ed] = Math.max(0, +el.value || 0);
    else if (ds.ed === 'seccion') { p.seccion = el.value; s.partes.sort((a, b) => ORDEN_SECCIONES.indexOf(a.seccion) - ORDEN_SECCIONES.indexOf(b.seccion)); renumerar(s); }
    else if (ds.ed === 'tieneAyudante') { p.tieneAyudante = el.checked; if (!el.checked) p.ayudante = ''; }
    else if (ds.ed === 'delPresidente') p.delPresidente = el.checked;
    else if (ds.ed === 'estudio') { p.etiquetaAyudante = el.checked ? 'Lector' : 'Ayudante'; if (el.checked) { p.tieneAyudante = false; p.ayudante = ''; } }
    guardar(); return;
  }
  if (ds.w) {
    const s = A.semana(ds.sem);
    if (ds.w === 'fecha') { const d = new Date(el.value); if (!isNaN(d)) s.fecha = isoZ(d); }
    else if (ds.w === 'cancion') s.canciones[+ds.i] = Math.max(0, +el.value || 0);
    else s[ds.w] = el.value.trim();
    guardar(); return;
  }
  if (ds.cargo) { if (el.value) D.cargos[ds.cargo] = el.value; else delete D.cargos[ds.cargo]; guardar(); return; }
  if (ds.tel !== undefined) { const v = el.value.trim(); if (v) D.telefonos[ds.tel] = v; else delete D.telefonos[ds.tel]; guardar(true); return; }
  if (ds.aj) {
    const aj = D.ajustes;
    if (ds.aj === 'hora') { const [hh, mm] = el.value.split(':').map(Number); aj.hora = hh || 0; aj.minuto = mm || 0; }
    else if (ds.aj === 'diaSemana') aj.diaSemana = +el.value;
    else aj[ds.aj] = el.value;
    guardar(); return;
  }
});

// ---------------- arranque ----------------

(function arrancar() {
  const local = leerLocal();
  if (local && local.datos) ponerDatos(local.datos, local.imagenes, local.modificado);
  else ponerDatos(datosIniciales(), {}, null);
  render();
  Nube.iniciar();
})();

document.getElementById('logoNav').src = IMG.logo;
</script>
